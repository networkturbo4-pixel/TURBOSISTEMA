function setpass(obj)
{
 
 obj.isclick = 1;
 postTableEncrypt(document.cmlogin.postSecurityFlag, document.cmlogin);
}
function mlhandle()
{
 postTableEncrypt(document.formML.postSecurityFlag, document.formML);
 document.formML.submit();
}
function addShowPassOper(){
  function showpass(){
    var srcObj = this;
    var iconDom = srcObj.querySelector(".eyeicon");
    var passInput = cmlogin.password;
    if( iconDom.alt == "show" ){
      iconDom.src = "LoginFiles/hidepass.png";
      iconDom.alt = "hide";
      passInput.type = "text";
    }else{
      iconDom.src = "LoginFiles/showpass.png";
      iconDom.alt = "show";
      passInput.type = "password";
    }
  }
  var icons = document.querySelectorAll('.iconspan1');
  for(let b in icons){
    icons[b].onclick = showpass;
  }
}
window.onload = addShowPassOper;
</SCRIPT>
